[package]
name = "html-note"
version = "0.1.0"
description = "HTML Note — редактор HTML-документов"
edition = "2021"

[lib]
name = "html_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
